# Fly.io config for the Fueli API. Change `app` to a globally unique name before `fly launch`.
app = "fueli"
primary_region = "lax"

[build]

[env]
  PORT = "8080"
  ANTHROPIC_MODEL = "claude-haiku-5-5"
  # Where Stripe Checkout returns users when the request has no allowed Origin.
  APP_URL = "https://fueli.vercel.app"
  SUPABASE_URL = "https://rdtqyizwcmhxirbganhn.supabase.co"
  # Comma-separated. Wildcard prefix allowed for Vercel preview URLs.
  ALLOWED_ORIGINS = "http://localhost:8081,https://fueli.vercel.app,https://fueli-*-miawu.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine always on for demo day (D-28): no ~3.5 s cold start after idle. Set back to 0 after class.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
